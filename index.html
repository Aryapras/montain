<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>maappp for kanjeng ratuu </title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            font-family: sans-serif;
        }
        .container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        button {
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 0 5px;
            border-radius: 5px;
        }
        .button-red {
            background-color: rgb(231, 3, 3);
            position: relative;
        }
        .button-blue {
            background-color: rgb(216, 71, 177);
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="./kesayangan aii.jpeg" alt="gambar kesayangan 
        aii.jpeg" width="200px">
        <h1>sayangkuu cintakuuu istrikuu maafin aku yaa </h1>
        <button class="button-red" id="tombolno">Ngga</button> 
        <button class="button-blue" onclick="terima()">iyaa</button>
    </div>
    <script>
        function terima() {
            Swal.fire({
                title: "Beneran dimaafin kann?", 
                icon: "success",
                showDenyButton: true,
                confirmButtonText: "iyaa sayangg"
            }).then((result) => {
                if(result.isConfirmed) {
                    window.location.href = "https://wa.me/6282248919991?text=iyaa%20sayangkuu%20cintakuu%20suamikuu%20dimaafin"
                }
            })
        }

        var tombolno = document.getElementById("tombolno")
        tombolno.addEventListener("click", function() {
            var yrandom = Math.floor(Math.random() * (300 - (-100) + 1)) + (-100)
            var xrandom = Math.floor(Math.random() * (100 - (-100) + 1)) + (-100)
            tombolno.style.bottom = yrandom + "px"
            tombolno.style.right = xrandom + "px"
        })
    </script>
</body>
</html>
